version: 1
# CLAUDE.md の「日本語の文章ルール」「使わない言い回し」のうち機械的に検出できるもの
rules:
  # 句読点
  - expected: ，
    pattern: 、
  - expected: ．
    pattern: 。

  # 固有名詞 (大文字小文字を無視して照合．URL・パス・ファイル名の一部は除外)
  # JSON は Python や Ruby のモジュール名 json と区別できないので入れていない
  - expected: "GitHub"
    pattern: /(?<![\w./@:-])GitHub(?![\w./@:-])/i
  - expected: "GitLab"
    pattern: /(?<![\w./@:-])GitLab(?![\w./@:-])/i
  - expected: "JavaScript"
    pattern: /(?<![\w./@:-])JavaScript(?![\w./@:-])/i
  - expected: "TypeScript"
    pattern: /(?<![\w./@:-])TypeScript(?![\w./@:-])/i
  - expected: "Node.js"
    pattern: /(?<![\w./@:-])Node\.js(?![\w./@:-])/i
  - expected: "npm"
    pattern: /(?<![\w./@:-])npm(?![\w./@:-])/i
  - expected: "Python"
    pattern: /(?<![\w./@:-])Python(?![\w./@:-])/i
